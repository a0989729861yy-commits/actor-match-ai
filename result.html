<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101525">
  <title>Gemini AI 適配分析｜MatchLens</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f5ff;font:16px/1.7 Arial,"Noto Sans TC",sans-serif}.container{max-width:1000px;margin:auto;padding:24px 18px 56px}header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 22px;border-bottom:1px solid #29334b}a{color:#bdc9ff}.hero{padding:28px 0 16px}.hero h1{margin:0;font-size:clamp(1.8rem,5vw,2.7rem)}.muted{color:#aab3c9}.status,.card,.panel{border:1px solid #303b54;border-radius:16px;background:#151e32;padding:18px;margin:16px 0}.status{color:#c9d2ee}.status.error{border-color:#9c4c62;color:#ffbdc7}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #66739a;border-top-color:#bd9cff;border-radius:50%;margin-right:9px;vertical-align:-2px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.card h2,.panel h2{margin:0 0 4px}.score{font-size:1.55rem;font-weight:800;color:#bba9ff}.badge{display:inline-block;padding:3px 9px;border-radius:20px;background:#27314a;color:#cbd4f1;font-size:.8rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail{padding:10px;background:#10182a;border-radius:10px}.bar{height:6px;margin-top:5px;background:#303b54;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8297ff,#bba1ff)}.block{border-top:1px solid #303b54;margin-top:16px;padding-top:12px}.works{padding-left:20px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.button{display:inline-block;border:0;border-radius:10px;background:#7387f5;color:#fff;padding:10px 16px;text-decoration:none;cursor:pointer}.note{font-size:.85rem;color:#929db4}@media(max-width:600px){.container{padding:16px 14px 40px}.grid{grid-template-columns:1fr}header{gap:10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="container">
    <header><strong>MatchLens</strong><a href="index.html">返回首頁</a></header>
    <section class="hero"><h1>Gemini AI 適配分析</h1><p class="muted">問卷 → Gemini 偏好理解 → Google Search → 六維度整理 → 加權計分</p></section>
    <div id="status" class="status" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span>正在啟動 Gemini AI 適配分析與 Google Search……</div>
    <section class="panel"><h2>分析說明</h2><p id="summaryText" class="muted">正在處理你的六維度偏好……</p></section>
    <main id="results" aria-live="polite"></main>
    <p class="note">適配分數由既有六維度規則及問卷權重計算。人物描述與標籤是 Gemini 整理內容，不能視為來源已證實事實；列出的網址來自本次 Google Search grounding，並非人工獨立查證。請自行開啟來源核對。</p>
    <a class="button" href="survey.html">重新填寫問卷</a>
  </div>
  <script>
  (() => {
    'use strict';
    const PREFERENCE_KEY = 'matchlens_preferences';
    const DIMENSIONS = ['外型風格', '氣質人設', '作品類型', '表演風格', '資歷區間', '觀看情境'];
    const results = document.getElementById('results'); const status = document.getElementById('status'); const summary = document.getElementById('summaryText');
    const el = (tag, cls, text) => { const node = document.createElement(tag); if (cls) node.className = cls; if (text !== undefined) node.textContent = String(text); return node; };
    function showError(message) { status.className = 'status error'; status.textContent = message; results.replaceChildren(); }
    function addLinks(parent, urls) { const list = el('ul', 'works'); (Array.isArray(urls) ? urls : []).forEach(value => { try { const url = new URL(value); if (!['http:', 'https:'].includes(url.protocol)) return; const li = el('li'); const a = el('a', '', url.href); a.href = url.href; a.target = '_blank'; a.rel = 'noopener noreferrer'; li.append(a); list.append(li); } catch {} }); if (list.childElementCount) parent.append(list); else parent.append(el('p', 'muted', '沒有可核對的搜尋來源。')); }
    function render(data) {
      if (data.ok !== true || data.geminiEnabled !== true || data.searchPerformed !== true || !Array.isArray(data.ranking) || !data.ranking.length) throw new Error('API 回應缺少成功狀態、搜尋狀態或推薦資料；不顯示結果。');
      if (typeof data.model !== 'string' || data.sourceStatus !== 'google-search-grounded-not-independently-verified') throw new Error('API 回應未通過模型與來源狀態驗證；不顯示結果。');
      results.replaceChildren();
      data.ranking.forEach(person => {
        if (typeof person.name !== 'string' || !Number.isFinite(Number(person.score)) || !Array.isArray(person.dimensions) || person.dimensions.length !== 6 || !person.evidence || person.evidence.sourceStatus !== data.sourceStatus || !Array.isArray(person.evidence.sourceUrls) || !person.evidence.sourceUrls.length) throw new Error('推薦資料缺少完整六維度或搜尋來源；不顯示不完整結果。');
        const card = el('article', 'card'); card.append(el('span', 'badge', `推薦 ${person.rank}｜${person.category || '演員'}`), el('h2', '', person.name), el('div', 'score', `適配分數 ${Number(person.score).toFixed(1)}%`));
        if (person.description) card.append(el('p', 'muted', `Gemini 整理描述（未經人工獨立查證）：${person.description}`));
        const dims = el('section', 'block'); dims.append(el('h3', '', '六維度匹配分析')); const grid = el('div', 'grid');
        person.dimensions.forEach(item => { if (!DIMENSIONS.includes(item.name) || !Number.isFinite(Number(item.score)) || Number(item.score) < 0 || Number(item.score) > 100) throw new Error('維度資料不合法；不顯示結果。'); const box = el('div', 'detail'); box.append(el('strong', '', `${item.name}｜${Number(item.score)}%`)); const bar = el('div', 'bar'); const fill = el('div', 'fill'); fill.style.width = `${Number(item.score)}%`; bar.append(fill); box.append(bar); grid.append(box); }); dims.append(grid); card.append(dims);
        const reason = el('section', 'block'); reason.append(el('h3', '', 'Gemini AI 推薦理由'), el('p', '', data.recommendationReason || data.summary || 'Gemini 未提供推薦理由。'), el('p', 'muted', `模型：${data.model}。推薦理由是 AI 生成的整理內容，不是人工查證結論。`)); card.append(reason);
        const works = el('section', 'block'); works.append(el('h3', '', '相關作品（需自行核對來源）'));
        if (Array.isArray(person.works) && person.works.length) { const ul = el('ul', 'works'); person.works.forEach(work => { if (!work || typeof work.title !== 'string' || !Array.isArray(work.sourceUrls) || !work.sourceUrls.length) return; const li = el('li'); li.append(document.createTextNode(`${work.title}${work.type ? `｜${work.type}` : ''}${work.year ? `｜${work.year}` : ''}`)); addLinks(li, work.sourceUrls); ul.append(li); }); works.append(ul); } else works.append(el('p', 'muted', '沒有通過搜尋來源關聯驗證的作品資料。');
        const video = el('a', 'button', '搜尋相關影片'); video.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(`${person.name} 作品 預告`)}`; video.target = '_blank'; video.rel = 'noopener noreferrer'; works.append(video); card.append(works);
        const source = el('section', 'block'); source.append(el('h3', '', '資料來源及查證狀態'), el('p', 'muted', 'Google Search grounding 引用；程式檢查人物姓名與搜尋引用關聯。這不是人工查證，也不保證來源內容真實或準確。')); addLinks(source, person.evidence.sourceUrls); card.append(source); results.append(card);
      });
    }
    async function init() {
      let preferences; try { preferences = JSON.parse(localStorage.getItem(PREFERENCE_KEY) || 'null'); } catch { showError('無法讀取本機問卷資料，請重新填寫問卷。'); return; }
      if (!preferences) { showError('尚未找到問卷資料，請先完成六維度問卷。'); return; }
      try {
        const response = await fetch('/api/recommendations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(preferences) });
        let data; try { data = await response.json(); } catch { throw new Error('分析服務回傳格式無效；未產生推薦。'); }
        if (!response.ok || data.ok !== true) { showError(data.error || 'Gemini AI 適配分析服務尚未啟用或搜尋失敗；未產生推薦。'); summary.textContent = '服務不可用時不會回退至預設候選資料。'; return; }
        render(data); status.className = 'status'; status.textContent = '分析完成。請自行核對 Google Search 來源；AI 整理內容不是人工查證。'; summary.textContent = data.summary || data.preferenceSummary || '已完成有搜尋引用的六維度適配計算。';
      } catch (error) { showError(error.message || '無法連接 Gemini AI 適配分析服務；未顯示推薦結果。'); summary.textContent = '確認伺服器環境已設定 GEMINI_API_KEY，且帳戶/model 支援 Google Search grounding。'; }
    }
    init();
  })();
  </script>
</body>
</html>
