<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101525">
  <meta name="description" content="使用可搜尋、分類的六維度偏好問卷建立個人化適配分析。">
  <title>六維度偏好問卷｜MatchLens</title>
  <link rel="stylesheet" href="survey.css">
  <script src="survey.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="MatchLens 首頁">Match<span>Lens</span></a>
    <a class="back-link" href="index.html">← 返回首頁</a>
  </header>
  <main class="survey-shell">
    <section class="intro">
      <p class="eyebrow">PERSONAL PREFERENCE ANALYSIS</p>
      <h1>建立你的六維度偏好模型</h1>
      <p class="intro-copy">按類別瀏覽或搜尋選項；每個維度都可略過。重要度採 1–5 分，略過的維度不會拉低適配分數。答案只保存在此瀏覽器，送出問卷後才用於分析。</p>
      <div class="progress-meta"><span id="stepLabel">第 1 / 6 步</span><span id="progressPercent">17%</span></div>
      <div class="progress-track" role="progressbar" aria-label="問卷完成進度" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1" id="progressTrack"><div id="progressFill"></div></div>
    </section>
    <form id="surveyForm" novalidate>
      <div id="questionPanels"></div>
      <section class="weight-summary" aria-labelledby="weightHeading">
        <div class="summary-heading"><div><p class="eyebrow">WEIGHT DISTRIBUTION</p><h2 id="weightHeading">推薦權重總覽</h2></div><strong id="weightTotal">100.00%</strong></div>
        <p class="summary-copy">「不知道怎麼選」預設為所有未略過維度重要度 3/5。啟用維度的權重正規化合計 100%；略過的維度權重為 0%。</p>
        <div id="weightSummary" class="weight-list"></div>
      </section>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="previousButton">上一題</button><span class="action-spacer"></span>
        <button type="button" class="btn btn-primary" id="nextButton">下一題 <span aria-hidden="true">→</span></button>
        <button type="submit" class="btn btn-primary" id="submitButton" hidden>開始 Gemini AI 適配分析</button>
      </div>
      <p class="privacy-note">匿名填答：答案及權重只儲存在本機瀏覽器的 <code>matchlens_preferences</code>；開始分析時才會傳送到伺服器。</p>
      <div id="formMessage" class="form-message" role="status" aria-live="polite" hidden></div>
    </form>
  </main>
</body>
</html>
